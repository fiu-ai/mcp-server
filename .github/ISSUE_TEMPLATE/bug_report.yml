name: Bug report / 问题反馈
description: Something is wrong with the MCP server or its data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste your API key anywhere in this issue.
        请不要在 issue 中粘贴 API Key。

  - type: input
    id: client
    attributes:
      label: MCP client / 客户端
      placeholder: Claude Code / Claude Desktop / Cherry Studio / Cursor / other
    validations:
      required: true

  - type: input
    id: toolset
    attributes:
      label: Toolset and endpoint / 工具集与 endpoint
      placeholder: "f10_financials / get_financial_statement"
    validations:
      required: true

  - type: textarea
    id: params
    attributes:
      label: Parameters / 调用参数
      description: The `params` object you sent, with the API key removed.
      render: json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual / 预期与实际
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error payload / 错误返回
      description: Include `requestId` if present — it is what lets us trace the call.
      render: json

  - type: input
    id: time
    attributes:
      label: When did it happen / 发生时间
      placeholder: "2026-08-06 14:30 UTC+8"
