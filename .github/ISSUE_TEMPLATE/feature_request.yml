name: Feature request / 功能建议
description: Request new data coverage or a new capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category / 类别
      options:
        - New market coverage / 新增市场
        - New data domain / 新增数据领域
        - New endpoint in an existing toolset / 现有工具集新增 endpoint
        - Parameter or filter / 参数或筛选条件
        - Documentation / 文档
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: need
    attributes:
      label: What do you need / 需求描述
      description: Describe the data or capability, and which market it applies to.
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use case / 使用场景
      description: What question would you ask the model, and what would a good answer look like?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround / 当前替代方案
